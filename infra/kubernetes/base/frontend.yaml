apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: secureflow
spec:
  replicas: 1
  selector:
    matchLabels:
      svc: frontend
  template:
    metadata:
      labels:
        svc: frontend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "frontend-role"

        # Inject SESSION_SECRET from Vault
        vault.hashicorp.com/agent-inject-secret-SESSION_SECRET: "secureflow/data/frontend"
        vault.hashicorp.com/agent-inject-template-SESSION_SECRET: |
          {{- with secret "secureflow/data/frontend" -}}
          export SESSION_SECRET="{{ .Data.data.SESSION_SECRET }}"
          {{- end }}

    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: jkairuthi/frontend:py312
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          # -----------------------------
          # HEALTH PROBES
          # -----------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          # -----------------------------
          # NON‑SECRET CONFIG
          # -----------------------------
          envFrom:
            - configMapRef:
                name: secureflow-config

          # -----------------------------
          # ENV VARS (non‑secret)
          # -----------------------------
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service:5002"

            # Secret injected by Vault
            - name: SESSION_SECRET
              value: ""

          # -----------------------------
          # SECURITY CONTEXT (intentionally vulnerable)
          # -----------------------------
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: secureflow
spec:
  type: NodePort
  selector:
    svc: frontend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
