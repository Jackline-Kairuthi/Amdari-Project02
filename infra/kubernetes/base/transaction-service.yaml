apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: secureflow
  labels:
    app: transaction-service
    team: secureflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
      team: secureflow
      svc: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
        team: secureflow
        svc: transaction-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "transaction-role"
        vault.hashicorp.com/agent-inject-secret-TX_DB_PASSWORD: "secureflow/data/transaction"
        vault.hashicorp.com/agent-inject-template-TX_DB_PASSWORD: |
          {{- with secret "secureflow/data/transaction" -}}
          export TX_DB_PASSWORD="{{ .Data.data.TX_DB_PASSWORD }}"
          {{- end }}
    spec:
      serviceAccountName: transaction-sa
      containers:
        - name: transaction-service
          image: jkairuthi/transaction-service@sha256:1c279bef656d9d5ff74c31f67d565db3712d5d530712b2f86c988cfdaa8705
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: secureflow-config
          env:
            - name: DB_HOST
              value: transaction-db
            - name: DB_NAME
              value: transactiondb
            - name: DB_USER
              value: txuser
            - name: TX_DB_PASSWORD
              value: ""
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: secureflow
  labels:
    app: transaction-service
    team: secureflow
spec:
  selector:
    app: transaction-service
    team: secureflow
    svc: transaction-service
  ports:
    - port: 5002
      targetPort: 5002



