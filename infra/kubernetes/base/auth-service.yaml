apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: secureflow
spec:
  replicas: 1
  selector:
    matchLabels:
      svc: auth-service
  template:
    metadata:
      labels:
        svc: auth-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "auth-role"

        # Correct KV v2 path (your real secret)
        vault.hashicorp.com/agent-inject-secret-auth: "secureflow/data/auth"

        # Correct template for KV v2
        vault.hashicorp.com/agent-inject-template-auth: |
          {{- with secret "secureflow/data/auth" -}}
          export AUTH_DB_PASSWORD="{{ .Data.data.AUTH_DB_PASSWORD }}"
          export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          {{- end }}

    spec:
      serviceAccountName: auth-sa

      containers:
        - name: auth-service
          image: jkairuthi/auth-service:py312-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5001

          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Sourcing Vault secrets..."
              for f in /vault/secrets/*; do
                echo "Loading $f"
                . "$f"
              done

              echo "Starting auth-service with secrets loaded"
              exec python app.py

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: secureflow-config

          env:
            - name: DB_HOST
              value: auth-db
            - name: DB_NAME
              value: authdb
            - name: DB_USER
              value: authuser
            - name: AUTH_DB_PASSWORD
              value: ""
            - name: JWT_SECRET
              value: ""

          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: secureflow
spec:
  selector:
    svc: auth-service
  ports:
    - port: 5001
      targetPort: 5001
